# =============================================================================
# Enterprise Gateway Compose Overlay for APISIX & Keycloak OIDC Integration
# =============================================================================
# Usage (from deploy/compose):
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d
#   OR:
#   podman compose -f docker-compose.yml -f docker-compose.gateway.yml up -d
#
# Connects to the `db` (PostgreSQL) container from the base stack.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Apache APISIX Configuration Datastore (etcd)
  # ---------------------------------------------------------------------------
  apisix-etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: pyphonecaller-etcd
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://apisix-etcd:2379
    volumes:
      - pyphonecaller_etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---------------------------------------------------------------------------
  # Apache APISIX Gateway Engine
  # ---------------------------------------------------------------------------
  apisix:
    image: docker.io/apache/apisix:${APISIX_VERSION:-3.9.1-debian}
    container_name: pyphonecaller-gateway
    restart: always
    volumes:
      - ../gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      apisix-etcd:
        condition: service_healthy
    ports:
      - "${APISIX_HTTP_PORT:-9080}:9080"
      - "${APISIX_HTTPS_PORT:-9443}:9443"
      - "${APISIX_ADMIN_PORT:-127.0.0.1:9180}:9180"
    extra_hosts:
      - "host.containers.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Apache APISIX Administration Dashboard
  # ---------------------------------------------------------------------------
  apisix-dashboard:
    image: docker.io/apache/apisix-dashboard:3.0.1-alpine
    container_name: pyphonecaller-dashboard
    restart: always
    volumes:
      - ../gateway/apisix/dashboard_conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    depends_on:
      apisix-etcd:
        condition: service_healthy
    ports:
      - "${APISIX_DASHBOARD_PORT:-9000}:9000"

  # ---------------------------------------------------------------------------
  # Keycloak IAM Service (Wired to the `db` PostgreSQL instance)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-25.0.2}
    container_name: pyphonecaller-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-py_phone_caller}
      KC_DB_USERNAME: ${POSTGRES_USER:-py_phone_caller}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-py_phone_caller_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me}
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
      - "${KEYCLOAK_HTTPS_PORT:-8443}:8443"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: always

volumes:
  pyphonecaller_etcd_data:
