<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>py-phone-caller Unified API Portal (APISIX Gateway)</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>📞</text></svg>">
    <style>
        html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .portal-header {
            background: #1e293b;
            color: #ffffff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .portal-header h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .portal-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .portal-header a:hover { text-decoration: underline; }
        #swagger-ui {
            background: #ffffff;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 1400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .swagger-ui .topbar {
            background-color: #0f172a !important;
            padding: 10px 20px;
        }
        .swagger-ui .topbar .download-url-wrapper select {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="portal-header">
        <h1><span>📞</span> py-phone-caller Unified API Portal (APISIX Gateway)</h1>
        <div>
            <a href="/">← Return to NOC Dashboard</a>
        </div>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                urls: [{"name": "Prometheus Alerts Webhook (:8084)", "url": "/api/v1/alerts/docs/swagger.json"}, {"name": "Telephony & Asterisk Caller (:8081)", "url": "/api/v1/telephony/docs/swagger.json"}, {"name": "SMS Gateway & Carrier Engine (:8085)", "url": "/api/v1/sms/docs/swagger.json"}, {"name": "Address Book & Duty Roster (:8087)", "url": "/api/v1/contacts/docs/swagger.json"}, {"name": "Call Scheduler Engine (:8086)", "url": "/api/v1/schedules/docs/swagger.json"}, {"name": "Audio Synthesis & TTS Engine (:8082)", "url": "/api/v1/audio/docs/swagger.json"}, {"name": "Call Registry & DTMF Acknowledgment (:8083)", "url": "/api/v1/registry/docs/swagger.json"}],
                "urls.primaryName": "Prometheus Alerts Webhook (:8084)",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout",
                persistAuthorization: true
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
