---
# Opt-in (py_phone_caller_remove_build_deps). Removing the toolchain shrinks
# the image but leaves the host unable to rebuild native wheels, so the next
# dependency bump needs --tags prereqs first. Package-manager autoremove is
# deliberately not used: it happily takes shared libraries with it.

- name: Remove the build packages
  ansible.builtin.package:
    name: "{{ py_phone_caller_build_packages }}"
    state: absent

- name: Remove the Rust toolchain
  ansible.builtin.package:
    name: "{{ py_phone_caller_rust_packages }}"
    state: absent
  when: py_phone_caller_final_config.caller_sms.caller_sms_carrier | default('') != 'on_premise'

- name: Drop the uv download cache
  ansible.builtin.file:
    path: "{{ py_phone_caller_uv_cache_dir }}"
    state: absent
