- name: Ensure target credential directory exists
  ansible.builtin.file:
    path: "{{ py_phone_caller_server_credentials_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Deploy server emergency credentials file
  ansible.builtin.template:
    src: credentials.env.j2
    dest: "{{ py_phone_caller_server_credentials_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
