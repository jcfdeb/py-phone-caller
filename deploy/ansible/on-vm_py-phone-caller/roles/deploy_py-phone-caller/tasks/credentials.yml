---
# ===========================================================================
# Method 1: Control Node lookup('password') with Ansible Vault
# ===========================================================================
# This task resolves or generates secrets for Keycloak, APISIX, and Web UI:
#
# 1. On the control node (localhost), if a secret file does not exist in
#    {{ py_phone_caller_credentials_dir }}/, Ansible generates a cryptographically
#    strong 32-character alphanumeric secret and writes it with 0600 permissions.
# 2. If the secret file already exists (whether plaintext or encrypted with
#    Ansible Vault), Ansible reads and decrypts it automatically using
#    lookup('ansible.builtin.file', ...).
# 3. Facts are populated for use in database, gateway, and service tasks.
# 4. On the target host, /etc/py-phone-caller/credentials.env is templated
#    with 0600 permissions (root:root) to provide emergency console reference.
# ===========================================================================

- name: Ensure control node credentials directory exists
  ansible.builtin.file:
    path: "{{ py_phone_caller_credentials_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Resolve Keycloak admin password
  ansible.builtin.set_fact:
    _ppc_keycloak_admin_password: >-
      {{ py_phone_caller_keycloak_admin_password
         if (py_phone_caller_keycloak_admin_password | default('', true) | length > 0)
         else ((lookup('ansible.builtin.file', py_phone_caller_credentials_dir ~ '/keycloak_admin_password.txt') | trim)
               if (py_phone_caller_credentials_dir ~ '/keycloak_admin_password.txt') is file
               else lookup('ansible.builtin.password', py_phone_caller_credentials_dir ~ '/keycloak_admin_password.txt chars=ascii_letters,digits length=32')) }}
  no_log: true
  run_once: true

