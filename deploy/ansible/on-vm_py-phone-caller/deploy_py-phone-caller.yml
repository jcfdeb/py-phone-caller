---
# Compatibility entry point. Inventory and existing variable namespaces remain.
# No credentials are printed in deployment output.
- name: Deploy Python through the shared stack entry point
  ansible.builtin.import_playbook: ../site.yml
  vars:
    stack_hosts: app_servers
    stack_legacy_platform: true
    stack_deploy_py_phone_caller: true
    stack_deploy_asterisk: false
    stack_deploy_openalert: false
