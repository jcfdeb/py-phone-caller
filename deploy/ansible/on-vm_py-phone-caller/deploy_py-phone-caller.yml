---
# Deploy the py-phone-caller microservice stack onto the hosts in
# [app_servers] as systemd units behind Caddy or Apache / APISIX.
#
#   ansible-galaxy collection install -r requirements.yml
#   ../tools/toml_to_ansible_vars.py          # src/config/*.toml -> group_vars
#   ansible-playbook deploy_py-phone-caller.yml
#
# The configuration comes from the group_vars/app_servers/ directory;
# everything else has a default in roles/deploy_py-phone-caller/defaults/main.yml.

- name: Deploy the py-phone-caller stack
  hosts: app_servers
  gather_facts: true

  vars:
    # Repository root on the control node: deploy/ansible/on-vm_py-phone-caller
    # is three levels down from it.
    py_phone_caller_local_src_path: "{{ playbook_dir | dirname | dirname | dirname }}"

  pre_tasks:
    # Both files live in the group_vars/app_servers/ *directory*: Ansible
    # reads every file in such a directory, but auto-loads a plain file only
    # when its stem is exactly the group name. A stray
    # "group_vars/app_servers.secrets.yml" is ignored without a word, so
    # check that the variables actually arrived rather than trusting the path.
    - name: Check that the generated group_vars are loaded
      ansible.builtin.assert:
        that:
          - py_phone_caller_config | default({}) | length > 0
          - py_phone_caller_config_secrets | default({}) | length > 0
        fail_msg: >-
          py_phone_caller_config / py_phone_caller_config_secrets are empty.
          Generate them with deploy/ansible/tools/toml_to_ansible_vars.py, and
          make sure they land in group_vars/app_servers/ (a directory).
        quiet: true
      tags: always

  roles:
    - role: deploy_py-phone-caller

  post_tasks:
    - name: Display Gateway & Keycloak access summary
      ansible.builtin.debug:
        msg:
          - "========================================================================"
          - "              PY-PHONE-CALLER GATEWAY & IAM DEPLOYMENT RECAP             "
          - "========================================================================"
          - "Web UI Portal (via APISIX):  {{ _ppc_effective_public_url }}/login"
          - "  SSO Login (Click 'Sign in with Single Sign-On'):"
          - "    Admin:                   admin_user     / {{ _ppc_keycloak_user_admin_password }} (alert-admin)"
          - "    Operator:                operator_user  / {{ _ppc_keycloak_user_operator_password }} (alert-operator)"
          - "    Viewer:                  viewer_user    / {{ _ppc_keycloak_user_viewer_password }} (alert-viewer)"
          - "  Local Fallback Login (Direct form):"
          - "    Admin Email:             {{ py_phone_caller_final_config.py_phone_caller_ui.ui_admin_user | default('admin@py-phone-caller.link') }}"
          - "    Admin Password:          {{ _ppc_web_ui_admin_password }}"
          - "------------------------------------------------------------------------"
          - "Keycloak Admin Console:      {{ _ppc_effective_public_url }}/admin"
          - "  Admin Username:            {{ py_phone_caller_keycloak_admin_user }}"
          - "  Admin Password:            {{ _ppc_keycloak_admin_password }}"
          - "  Keycloak Realm:            {{ py_phone_caller_keycloak_realm }}"
          - "------------------------------------------------------------------------"
          - "APISIX Dashboard:            http://{{ ansible_host | default(inventory_hostname) }}:{{ py_phone_caller_gateway_dashboard_port }}"
          - "  Dashboard User:            {{ py_phone_caller_apisix_dashboard_user }}"
          - "  Dashboard Password:        {{ _ppc_apisix_dashboard_password }}"
          - "M2M Client ID:               {{ py_phone_caller_keycloak_m2m_client_id }}"
          - "M2M Client Secret:           {{ _ppc_keycloak_m2m_client_secret }}"
          - "------------------------------------------------------------------------"
          - "Target Server Credentials:   {{ py_phone_caller_server_credentials_path }} (0600 root:root)"
          - "Control Node Secrets Dir:    {{ py_phone_caller_credentials_dir }}/"
          - "Protect secrets with Vault:  ansible-vault encrypt {{ py_phone_caller_credentials_dir }}/*"
          - "========================================================================"
      when: py_phone_caller_manage_gateway | bool
