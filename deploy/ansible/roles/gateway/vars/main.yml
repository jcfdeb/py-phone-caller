---
gateway_keycloak_environment:
  KEYCLOAK_URL: "http://127.0.0.1:{{ py_phone_caller_keycloak_http_port }}"
  KEYCLOAK_ADMIN_USER: "{{ py_phone_caller_keycloak_admin_user }}"
  KEYCLOAK_ADMIN_PASS: "{{ _ppc_keycloak_admin_password }}"
  KEYCLOAK_REALM: "{{ py_phone_caller_keycloak_realm }}"
  KEYCLOAK_M2M_SECRET: "{{ _ppc_keycloak_m2m_client_secret }}"
  KEYCLOAK_PUBLIC_URL: "{{ _ppc_effective_public_url }}"
  KEYCLOAK_USER_ADMIN_PASS: "{{ _ppc_keycloak_user_admin_password }}"
  KEYCLOAK_USER_OPERATOR_PASS: "{{ _ppc_keycloak_user_operator_password }}"
  KEYCLOAK_USER_VIEWER_PASS: "{{ _ppc_keycloak_user_viewer_password }}"
  PPC_TOPOLOGY: "{{ py_phone_caller_topology | default('legacy') }}"
gateway_apisix_environment:
  APISIX_DASHBOARD_URL: "http://127.0.0.1:{{ py_phone_caller_gateway_dashboard_port }}"
  APISIX_DASHBOARD_USER: "{{ py_phone_caller_apisix_dashboard_user }}"
  APISIX_DASHBOARD_PASS: "{{ _ppc_apisix_dashboard_password }}"
  UPSTREAM_HOST: "{{ py_phone_caller_service_host }}"
  KEYCLOAK_PORT: "{{ py_phone_caller_keycloak_http_port }}"
  PPC_TOPOLOGY: "{{ py_phone_caller_topology | default('legacy') }}"
  PPC_PUBLIC_URL: "{{ py_phone_caller_public_url | default('') }}"
# Persist hashes, never credentials. Removing a completion stamp explicitly
# requests reprovisioning after out-of-band changes or remote data loss.
gateway_keycloak_fingerprint: >-
  {{ {'script': lookup('ansible.builtin.file', 'setup_keycloak.py'),
      'environment': gateway_keycloak_environment,
      'database': py_phone_caller_final_config.database,
      'keycloak_database': ({'url': gateway_keycloak_postgresql_url,
                            'username': gateway_keycloak_postgresql_username,
                            'password': gateway_keycloak_postgresql_password}
                           if py_phone_caller_topology | default('legacy') != 'legacy' else {}),
      'image': py_phone_caller_keycloak_image} | to_json(sort_keys=true) | hash('sha256') }}
gateway_apisix_fingerprint: >-
  {{ {'script': lookup('ansible.builtin.file', 'setup_apisix_routes.py'),
      'environment': gateway_apisix_environment,
      'image': py_phone_caller_apisix_image} | to_json(sort_keys=true) | hash('sha256') }}
