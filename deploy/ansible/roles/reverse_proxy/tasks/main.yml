---
# Caddy can bind :80 and :443 and still never receive a packet: a NAT
# REDIRECT/DNAT rule installed by another proxy (a rootless Podman container
# publishing 8080/8443, for example) diverts the traffic first, loopback
# included. The result looks healthy from systemd and fails only at the TLS
# handshake, so check before installing rather than after.

- name: Check ingress before changing the host
  ansible.builtin.import_tasks: preflight.yml

- name: Install the Caddy repository prerequisites (Debian)
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - gnupg
    state: present
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - ansible_facts['os_family'] == "Debian"

- name: Require a reviewed Caddy signing key checksum
  ansible.builtin.assert:
    that:
      - py_phone_caller_caddy_signing_key_checksum is match('^sha256:[0-9a-f]{64}$')
    fail_msg: Supply py_phone_caller_caddy_signing_key_checksum before managing the upstream repository.
    quiet: true
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - ansible_facts['os_family'] == 'Debian'

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - ansible_facts['os_family'] == 'Debian'

- name: Install the Caddy signing key (Debian)
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    checksum: "{{ py_phone_caller_caddy_signing_key_checksum }}"
    dest: /etc/apt/keyrings/caddy-stable.asc
    owner: root
    group: root
    mode: "0644"
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - ansible_facts['os_family'] == "Debian"

- name: Add the Caddy repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc]
      https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    state: present
    filename: caddy-stable
    update_cache: true
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - ansible_facts['os_family'] == "Debian"

- name: Enable the Caddy COPR repository (RHEL/Rocky)
  ansible.builtin.command:
    cmd: dnf -y copr enable @caddy/caddy
    creates: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:group_caddy:caddy.repo"
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - ansible_facts['os_family'] == "RedHat"
    - not (ansible_facts['distribution'] in ['Rocky', 'AlmaLinux'] and ansible_facts['distribution_major_version'] == '10')

- name: Install Caddy
  ansible.builtin.package:
    name: caddy
    state: present

- name: Configure Caddy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: Reload Caddy
  no_log: "{{ py_phone_caller_topology | default('legacy') != 'legacy' and py_phone_caller_tls_mode | default('legacy') == 'provided' }}"
  diff: false

- name: Ensure internal/local Caddy domain resolves to loopback in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+.*\b{{ caddy_domain_name | regex_escape }}\b'
    line: "127.0.0.1 {{ caddy_domain_name }}"
    state: present
  when:
    - caddy_domain_name is defined
    - caddy_domain_name | length > 0
    - >-
      (py_phone_caller_tls_mode | default('legacy') == 'internal') or
      (caddy_domain_name is search('\.(lan|local|internal|test)$'))

- name: Enable and start Caddy
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

- name: Apply pending Caddy configuration changes immediately
  ansible.builtin.meta: flush_handlers
