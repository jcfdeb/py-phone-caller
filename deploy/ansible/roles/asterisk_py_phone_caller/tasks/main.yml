---
- name: "Load OS-specific variables for {{ ansible_facts['os_family'] }}"
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Check RPM provider ownership before legacy sound preflight
  ansible.builtin.import_tasks: provider_guard.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Validate PBX inputs before changing the host
  ansible.builtin.include_tasks: preflight.yml

- name: "Install Asterisk for {{ ansible_facts['os_family'] }}"
  ansible.builtin.include_tasks: "install_{{ ansible_facts['os_family'] }}.yml"

- name: Ensure Asterisk group exists
  ansible.builtin.group:
    name: "{{ asterisk_group }}"
    state: present
    system: true

- name: Ensure Asterisk user exists
  ansible.builtin.user:
    name: "{{ asterisk_user }}"
    group: "{{ asterisk_group }}"
    state: present
    system: true
    shell: /sbin/nologin

- name: "Configure Asterisk and Deploy Audio"
  ansible.builtin.include_tasks: configure.yml

- name: Apply pending Asterisk configuration reloads immediately
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Verify the selected third-party PBX without dispatch
  ansible.builtin.include_tasks: verify_allstarlink.yml
  when:
    - asterisk_package_provider in ['allstarlink', 'tucny']
    - not ansible_check_mode

- name: Verify explicitly selected IAX2 without dispatch
  ansible.builtin.include_tasks: verify_iax.yml
  when:
    - local_iax
    - not ansible_check_mode

- name: Verify ready-to-use local SIP extension 1000 without dispatch
  ansible.builtin.include_tasks: verify_local_sip_exten_1000.yml
  when:
    - asterisk_sip_exten_1000_enabled
    - not ansible_check_mode
