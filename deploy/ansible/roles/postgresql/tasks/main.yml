---
- name: Manage the local PostgreSQL service
  when:
    - py_phone_caller_manage_postgresql | bool
    - py_phone_caller_manage_local_postgres | bool
    - py_phone_caller_final_config.database.db_host in py_phone_caller_local_db_hosts
  block:
    - name: Install PostgreSQL
      ansible.builtin.package:
        name: "{{ py_phone_caller_postgres_packages }}"
        state: present

    - name: Initialise PostgreSQL on RHEL and Rocky
      ansible.builtin.command:
        cmd: postgresql-setup --initdb
        creates: /var/lib/pgsql/data/PG_VERSION
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Enable and start PostgreSQL
      ansible.builtin.service:
        name: "{{ py_phone_caller_postgres_service }}"
        state: started
        enabled: true

    - name: Provision local application databases
      ansible.builtin.include_tasks:
        file: database.yml
        apply:
          no_log: true
          diff: false
