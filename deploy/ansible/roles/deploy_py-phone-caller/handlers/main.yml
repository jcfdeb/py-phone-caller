---
# Shared configuration and dependency changes affect all declared Python
# services; source and unit changes restart only their explicit consumers.
- name: Record audio dependency changes
  ansible.builtin.set_fact:
    _ppc_changed_services: "{{ (_ppc_changed_services | default([])) + ['generate_audio'] }}"
  listen: Restart audio service
  notify: Restart affected Python services
  changed_when: true

- name: Record SMS dependency changes
  ansible.builtin.set_fact:
    _ppc_changed_services: "{{ (_ppc_changed_services | default([])) + ['caller_sms', 'celery_worker'] }}"
  listen: Restart SMS services
  notify: Restart affected Python services
  changed_when: true

- name: Record shared Python dependency changes
  ansible.builtin.set_fact:
    _ppc_changed_services: "{{ py_phone_caller_services | map(attribute='name') | list }}"
  listen: Restart py-phone-caller services

- name: Inspect explicitly owned Python units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ py_phone_caller_service_prefix }}{{ item.name | replace('_', '-') }}.service"
  loop: "{{ py_phone_caller_services }}"
  register: _ppc_units_to_restart
  listen: [Restart py-phone-caller services, Restart affected Python services]
  when: py_phone_caller_manage_services | bool

- name: Restart affected installed Python units
  ansible.builtin.systemd_service:
    name: "{{ py_phone_caller_service_prefix }}{{ item.item.name | replace('_', '-') }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ _ppc_units_to_restart.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - py_phone_caller_manage_services | bool
    - item.stat.exists | default(false)
    - item.item.name in (_ppc_changed_services | default([]))
  listen: [Restart py-phone-caller services, Restart affected Python services]
