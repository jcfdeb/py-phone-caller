---
- name: Install exclusively from verified air-gapped inputs
  ansible.builtin.include_tasks: install_offline.yml
  when: py_phone_caller_connectivity | default('online') == 'airgapped'

- name: Check for an existing uv
  ansible.builtin.stat:
    path: "{{ py_phone_caller_uv_bin }}"
  register: _ppc_uv
  when: py_phone_caller_connectivity | default('online') == 'online'

- name: Download the reviewed uv installer
  ansible.builtin.get_url:
    url: "{{ py_phone_caller_uv_installer_url }}"
    checksum: "{{ py_phone_caller_uv_installer_checksum }}"
    dest: "{{ py_phone_caller_uv_dir }}/uv-install.sh"
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0700"
  no_log: true
  diff: false
  when: py_phone_caller_connectivity | default('online') == 'online' and not _ppc_uv.stat.exists

- name: Install uv
  ansible.builtin.command:
    argv: [/bin/sh, "{{ py_phone_caller_uv_dir }}/uv-install.sh"]
    creates: "{{ py_phone_caller_uv_bin }}"
  environment:
    UV_INSTALL_DIR: "{{ py_phone_caller_uv_dir }}"
    UV_NO_MODIFY_PATH: "1"
  become: true
  become_user: "{{ py_phone_caller_user }}"
  when: py_phone_caller_connectivity | default('online') == 'online' and not _ppc_uv.stat.exists

- name: Check the installed uv version
  ansible.builtin.command:
    argv: ["{{ py_phone_caller_uv_bin }}", --version]
  register: _ppc_uv_version
  changed_when: false
  failed_when: _ppc_uv_version.stdout.split()[1] != py_phone_caller_uv_version
  when: py_phone_caller_connectivity | default('online') == 'online'

- name: Confirm uv landed where the role expects it
  ansible.builtin.stat:
    path: "{{ py_phone_caller_uv_bin }}"
  register: _ppc_uv_installed
  when: py_phone_caller_connectivity | default('online') == 'online'

- name: Fail when uv is missing
  ansible.builtin.assert:
    that:
      - _ppc_uv_installed.stat.exists
      - _ppc_uv_installed.stat.executable
    fail_msg: >-
      The uv installer reported success but {{ py_phone_caller_uv_bin }} is
      missing. Re-run with -vvv to see the installer output, or install uv by
      hand into {{ py_phone_caller_uv_dir }}.
    quiet: true
  when: py_phone_caller_connectivity | default('online') == 'online'

- name: Create the uv state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0755"
  loop:
    - "{{ py_phone_caller_uv_python_install_dir }}"
    - "{{ py_phone_caller_uv_cache_dir }}"
  when: py_phone_caller_connectivity | default('online') == 'online'

# --frozen keeps uv honest about uv.lock: it never silently re-resolves.
# --all-packages installs every workspace member, --no-dev leaves the test
# tooling out. A failure here is fatal on purpose: starting the units against
# a half-built virtualenv only produces a crash loop that is harder to read.
#
# --inexact when the native SMS engine is in play: it is compiled here and
# installed straight into the virtualenv, so it is not in uv.lock and an
# exact sync would uninstall it on every run - which then rebuilt it, and
# restarted every service, forever.
- name: Build the virtualenv from uv.lock
  ansible.builtin.command:
    cmd: >-
      {{ py_phone_caller_uv_bin }} sync
      --frozen --all-packages --no-dev
      {{ '--inexact' if (_ppc_sms_on_premise or py_phone_caller_final_config.generate_audio.tts_engine == 'kokoro_tts' or (py_phone_caller_install_spacy_model | default(false) | bool) or (py_phone_caller_install_kokoro_cjk | default(false) | bool)) else '' }}
      --python {{ py_phone_caller_python_version }}
    chdir: "{{ py_phone_caller_install_dir }}"
  environment: "{{ _ppc_uv_env }}"
  become: true
  become_user: "{{ py_phone_caller_user }}"
  register: _ppc_uv_sync
  # uv reports "Audited N packages" when there is nothing to do.
  changed_when: >-
    'Installed' in (_ppc_uv_sync.stdout ~ _ppc_uv_sync.stderr) or
    'Uninstalled' in (_ppc_uv_sync.stdout ~ _ppc_uv_sync.stderr)
  timeout: "{{ py_phone_caller_uv_sync_timeout }}"
  notify: Restart py-phone-caller services
  no_log: true
  diff: false
  when: py_phone_caller_connectivity | default('online') == 'online'

# Upstream PyPI wheel nvidia_cusparselt_cu13-0.8.1-py3-none-manylinux2014_aarch64.whl
# ships internal .dist-info/WHEEL metadata tagged "manylinux2014_sbsa", causing uv sync
# on aarch64 to see a platform-tag mismatch and reinstall it on every rerun. Normalize
# only the installed venv metadata so unchanged reruns remain idempotent (changed=0).
- name: Normalize aarch64 SBSA wheel tag in installed virtualenv metadata
  ansible.builtin.command:
    argv:
      - "{{ py_phone_caller_venv_dir }}/bin/python"
      - -I
      - -B
      - -c
      - >-
        import pathlib, sys;
        [p.write_text(p.read_text(encoding='utf-8').replace('Tag: py3-none-manylinux2014_sbsa', 'Tag: py3-none-manylinux2014_aarch64'), encoding='utf-8')
         for p in pathlib.Path(sys.argv[1]).glob('lib/python*/site-packages/nvidia_cusparselt_cu13-*.dist-info/WHEEL')
         if 'Tag: py3-none-manylinux2014_sbsa' in p.read_text(encoding='utf-8')]
      - "{{ py_phone_caller_venv_dir }}"
  become: true
  become_user: "{{ py_phone_caller_user }}"
  changed_when: false
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - (ansible_facts['architecture'] | default('')) == 'aarch64'
    - _ppc_uv_sync is changed

- name: Download the reviewed spaCy English model for Kokoro
  ansible.builtin.get_url:
    url: "{{ py_phone_caller_spacy_model_url }}"
    checksum: "{{ py_phone_caller_spacy_model_checksum }}"
    dest: "{{ py_phone_caller_uv_cache_dir }}/en_core_web_sm-3.8.0-py3-none-any.whl"
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0644"
  when: py_phone_caller_connectivity | default('online') == 'online' and (py_phone_caller_final_config.generate_audio.tts_engine == 'kokoro_tts' or (py_phone_caller_install_spacy_model | default(false) | bool))

- name: Ensure spaCy English pipeline is installed for Kokoro TTS
  ansible.builtin.command:
    cmd: >-
      {{ py_phone_caller_uv_bin }} pip install
      --python {{ py_phone_caller_venv_dir }}/bin/python
      --no-deps {{ py_phone_caller_uv_cache_dir }}/en_core_web_sm-3.8.0-py3-none-any.whl
  environment: "{{ _ppc_uv_env }}"
  become: true
  become_user: "{{ py_phone_caller_user }}"
  register: _ppc_spacy_en
  changed_when: "'Installed' in _ppc_spacy_en.stdout or 'Installed' in _ppc_spacy_en.stderr"
  when: py_phone_caller_connectivity | default('online') == 'online' and (py_phone_caller_final_config.generate_audio.tts_engine == 'kokoro_tts' or (py_phone_caller_install_spacy_model | default(false) | bool))
  no_log: true
  notify: Restart audio service

- name: Write build constraints for Kokoro CJK G2P native extensions
  ansible.builtin.copy:
    content: "cython<3.1\n"
    dest: "{{ py_phone_caller_uv_cache_dir }}/kokoro-cjk-build-constraints.txt"
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0644"
  when:
    - py_phone_caller_connectivity | default('online') == 'online' and (py_phone_caller_final_config.generate_audio.tts_engine == 'kokoro_tts' or (py_phone_caller_install_kokoro_cjk | default(false) | bool))
    - py_phone_caller_kokoro_cjk_packages | default([]) | length > 0

- name: Ensure Kokoro Japanese and Chinese G2P packages are installed
  ansible.builtin.command:
    argv: >-
      {{ [py_phone_caller_uv_bin, '--no-config', 'pip', 'install',
          '--python', py_phone_caller_venv_dir ~ '/bin/python',
          '--build-constraint', py_phone_caller_uv_cache_dir ~ '/kokoro-cjk-build-constraints.txt']
         + (py_phone_caller_kokoro_cjk_packages | default([])) }}
    chdir: "{{ py_phone_caller_install_dir }}"
  environment: "{{ _ppc_uv_env }}"
  become: true
  become_user: "{{ py_phone_caller_user }}"
  register: _ppc_kokoro_cjk
  changed_when: "'Installed' in (_ppc_kokoro_cjk.stdout ~ _ppc_kokoro_cjk.stderr)"
  when:
    - py_phone_caller_connectivity | default('online') == 'online' and (py_phone_caller_final_config.generate_audio.tts_engine == 'kokoro_tts' or (py_phone_caller_install_kokoro_cjk | default(false) | bool))
    - py_phone_caller_kokoro_cjk_packages | default([]) | length > 0
  no_log: true
  notify: Restart audio service

# The Rust engine drives the GSM modems directly; it is only needed when the
# on-premise SMS carrier is selected.
#
# It is built as a wheel and then installed explicitly, rather than with
# "maturin develop": "uv run --with maturin" builds an ephemeral overlay
# environment and points VIRTUAL_ENV at it, so "develop" installs the module
# into a directory that is deleted moments later. The service then starts
# happily and logs "Rust SMS engine not found" at runtime. Building a wheel
# does not depend on VIRTUAL_ENV at all, and the import check below turns any
# remaining silent failure into a failed play.
- name: Decide whether the native SMS engine needs building
  ansible.builtin.shell:
    # The wheel installs a package directory (rust_engine/ containing
    # rust_engine.cpython-*.so), so ask the interpreter where the extension
    # actually is instead of guessing a path. Exit 0 = up to date.
    cmd: |
      set -o pipefail
      so=$({{ py_phone_caller_venv_dir }}/bin/python -c \
             'import importlib.util as u; s = u.find_spec("rust_engine"); print(s.origin if s else "")' \
           2>/dev/null) || exit 1
      [ -n "$so" ] && [ -e "$so" ] || exit 1
      if find {{ _ppc_sms_engine_dir }} -path '*/target' -prune -o -type f -newer "$so" -print -quit | grep -q .; then
        exit 1
      fi
      exit 0
    executable: /bin/bash
  register: _ppc_engine_current
  changed_when: false
  failed_when: false
  when: py_phone_caller_connectivity | default('online') == 'online' and _ppc_sms_on_premise

- name: Build and install the native SMS engine
  when:
    - py_phone_caller_connectivity | default('online') == 'online'
    - _ppc_sms_on_premise
    - _ppc_engine_current.rc | default(1) != 0
  become: true
  become_user: "{{ py_phone_caller_user }}"
  environment: "{{ _ppc_uv_env | combine({'PYO3_USE_ABI3_FORWARD_COMPATIBILITY': '1'}) }}"
  notify: Restart SMS services
  no_log: true
  diff: false
  block:
    - name: Build the native SMS engine wheel
      ansible.builtin.command:
        cmd: >-
          {{ py_phone_caller_uv_bin }} tool run --from maturin=={{ py_phone_caller_maturin_version }}
          maturin build --release --locked
          --manifest-path {{ _ppc_sms_engine_dir }}/Cargo.toml
          --interpreter {{ py_phone_caller_venv_dir }}/bin/python
          --out {{ _ppc_sms_wheel_dir }}
        chdir: "{{ py_phone_caller_install_dir }}"
      register: _ppc_maturin
      changed_when: true

    - name: Install the native SMS engine into the virtualenv
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          {{ py_phone_caller_uv_bin }} pip install --python {{ py_phone_caller_venv_dir }}
          --reinstall {{ _ppc_sms_wheel_dir }}/*.whl
        executable: /bin/bash
      register: _ppc_engine_install
      changed_when: "'Installed' in (_ppc_engine_install.stdout ~ _ppc_engine_install.stderr)"

- name: Confirm the native SMS engine imports
  ansible.builtin.command:
    cmd: "{{ py_phone_caller_venv_dir }}/bin/python -c 'import rust_engine'"
  become: true
  become_user: "{{ py_phone_caller_user }}"
  changed_when: false
  register: _ppc_engine_import
  failed_when: _ppc_engine_import.rc != 0
  when: py_phone_caller_connectivity | default('online') == 'online' and _ppc_sms_on_premise

# Everything above ran as the service account, so the virtualenv and the uv
# state are already owned correctly; no recursive chown over ~50k torch files.

- name: Create the log directory
  ansible.builtin.file:
    path: "{{ py_phone_caller_log_dir }}"
    state: directory
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0755"
