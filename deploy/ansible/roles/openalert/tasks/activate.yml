---
- name: Select validated activation decision and clear previous instance recovery state
  ansible.builtin.set_fact:
    openalert_activation_plan: "{{ openalert_activation_plans[openalert_instance.name] }}"
    openalert_checkpoint_transaction: ""
    openalert_activation_installed: false

- name: Checkpoint and activate only changed instances
  ansible.builtin.include_tasks: activate_changed.yml
