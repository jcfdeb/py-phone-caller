---
- name: Require an actual run for staged binary validation
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: Use tests/render.yml for offline rendering; check mode cannot validate new releases or service-account permissions.

- name: Require the supported native platform even for direct adoption
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == 'systemd'
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
      - >-
        (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13')
        or (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '26.04')
        or (ansible_facts['distribution'] in ['Rocky', 'AlmaLinux'] and ansible_facts['distribution_major_version'] == '10'
            and ansible_facts['architecture'] == 'x86_64')
    fail_msg: OpenAlert lifecycle operations require a supported native Debian 13, Ubuntu 26.04, or Rocky/AlmaLinux 10 AMD64 systemd host.

- name: Acquire shared host lifecycle lock and refuse stale or concurrent writers
  ansible.builtin.command:
    argv:
      - mkdir
      - --mode=0700
      - --
      - /run/lock/py-phone-caller-lifecycle
  changed_when: false

- name: Run OpenAlert under the shared lifecycle lock
  block:
    - name: Validate stage and activate without concurrent lifecycle writers
      ansible.builtin.import_tasks: run.yml
  always:
    - name: Release only the lock acquired by this run
      ansible.builtin.file:
        path: /run/lock/py-phone-caller-lifecycle
        state: absent
      changed_when: false
