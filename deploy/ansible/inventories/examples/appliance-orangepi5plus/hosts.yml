---
# Sanitized all-in-one ARM64 appliance profile for Orange Pi 5 Plus (RK3588).
#
# Physical Orange Pi 5 Plus RK3588 hardware qualification (connected online and
# 100% air-gapped) completed on 2026-11-19. Replace placeholder host IP, SSH
# user, serial device paths, and checksums before deploying.
# See docs/appliance-arm64.md, docs/support-matrix.md, and
# deploy/docs/09-arm64-appliance-and-airgapped-deployment.md.
all:
  children:
    stack:
      hosts:
        orangepi5plus-appliance:
          ansible_host: 192.0.2.50
          ansible_user: deploy
      vars:
        # All-in-one local selection: Python + Asterisk + local PostgreSQL/queue.
        # Enable stack_deploy_openalert: true only when deploying a verified
        # arm64 (aarch64-unknown-linux-gnu) OpenAlert release bundle.
        stack_deploy_py_phone_caller: true
        stack_deploy_asterisk: true
        stack_deploy_openalert: false

        # Ubuntu 26.04 LTS uses distro packages; on Debian 13 select allstarlink.
        asterisk_package_provider: distro
        asterisk_http_bindaddr: 127.0.0.1
        asterisk_sip_bindaddr: 127.0.0.1:5060
        asterisk_sip_trunk_enabled: false
        local_sip: false
        local_iax: false

        # Standard local-authentication topology with Caddy internal TLS;
        # no APISIX/Keycloak gateway containers and no automatic Wi-Fi AP or
        # WireGuard reconfiguration.
        py_phone_caller_topology: standard
        py_phone_caller_ingress: caddy
        py_phone_caller_tls_mode: internal
        py_phone_caller_connectivity: online
        py_phone_caller_public_url: https://appliance.internal
        caddy_domain_name: appliance.internal

        py_phone_caller_git_repo: ""
        py_phone_caller_local_src_path: /srv/releases/py-phone-caller
        py_phone_caller_uv_installer_checksum: "sha256:REPLACE_WITH_REVIEWED_SHA256"
        # Optional: install en_core_web_sm and Kokoro CJK (Japanese/Chinese) G2P tokenizers
        # alongside Piper/Silero/MMS so all Kokoro voices work offline per-call.
        py_phone_caller_install_spacy_model: false
        py_phone_caller_install_kokoro_cjk: false
        # Official en_core_web_sm-3.8.0-py3-none-any.whl SHA-256 (required if enabled online):
        # py_phone_caller_spacy_model_checksum: "sha256:1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"

        py_phone_caller_manage_postgresql: true
        py_phone_caller_manage_queue: true
        py_phone_caller_manage_gateway: false
        py_phone_caller_manage_reverse_proxy: true
        py_phone_caller_manage_firewall: false

        # Configurable appliance worker and systemd resource limits.
        # Values below are tuned for an 8-core RK3588 SBC (4× A76 + 4× A55).
        py_phone_caller_ui_workers: 2
        py_phone_caller_ui_threads: 8
        py_phone_caller_ui_timeout: 120
        py_phone_caller_celery_concurrency: 2
        py_phone_caller_service_cpu_quota: ""
        py_phone_caller_service_memory_high: "512M"
        py_phone_caller_service_memory_max: "1G"
        py_phone_caller_service_tasks_max: 256
        py_phone_caller_service_resource_overrides:
          generate_audio:
            cpu_quota: "400%"
            memory_high: "2G"
            memory_max: "4G"
            tasks_max: 512
          celery_worker:
            cpu_quota: "200%"
            memory_high: "1G"
            memory_max: "2G"
            tasks_max: 512

        py_phone_caller_config:
          auth:
            provider: local
            oauth2:
              enabled: false
          gateway:
            behind_gateway: false
          database:
            db_host: 127.0.0.1
            db_port: 5432
            db_name: py_phone_caller
            db_user: py_phone_caller
          queue:
            queue_host: 127.0.0.1
            queue_port: 6379
            queue_url: redis://127.0.0.1:6379/0
          py_phone_caller_ui:
            ui_listen_on_host: 127.0.0.1
            ui_port: 5000
          caller_prometheus_webhook:
            prometheus_webhook_receivers: []
          caller_sms:
            caller_sms_carrier: on_premise
            # Always bind physical USB/UART modems via persistent /dev/serial/by-id/
            # symlinks rather than volatile /dev/ttyUSB* or /dev/ttyACM* nodes.
            modems:
              - id: sim7600_primary
                port: /dev/serial/by-id/usb-REPLACE_WITH_MODEM_ID-if02-port0
                baud_rate: 115200
                priority: 1
          generate_audio:
            tts_engine: piper_tts
            cuda: false
            num_of_cpus: 4
            preload_models: []
          asterisk_recaller:
            times_to_dial: 0
            call_backup_callee_max_times: 0

        # Optional co-located OpenAlert instance using persistent serial device paths:
        # openalert_release:
        #   source: /srv/releases/openalertd-arm64.tar.gz
        #   sha256: REPLACE_WITH_TRUSTED_ARM64_SHA256
        # openalert_instances:
        #   field:
        #     service_name: openalertd.service
        #     config_template: "{{ inventory_dir }}/../templates/private.toml.j2"
        #     health_url: http://127.0.0.1:8090/health
        #     rest_port: 8090
        #     supplementary_groups:
        #       - dialout
        #     serial_devices:
        #       - /dev/serial/by-id/usb-REPLACE_WITH_MESHTASTIC_ID-if00-port0
        #     memory_max: "512M"
        #     cpu_quota: "100%"
        #     tasks_max: 256
