---
stack:
  hosts:
    openalert-example:
      ansible_host: 192.0.2.10
      ansible_user: deploy
  vars:
    stack_deploy_py_phone_caller: false
    stack_deploy_asterisk: false
    stack_deploy_openalert: true
    openalert_release:
      source: /srv/releases/openalertd.tar.gz
      sha256: REPLACE_WITH_TRUSTED_SHA256
    openalert_instances:
      hub:
        service_name: openalertd.service
        config_template: "{{ inventory_dir }}/../templates/private.toml.j2"
        health_url: http://127.0.0.1:8090/health
        rest_port: 8090
      public:
        service_name: openalertd-public.service
        config_template: "{{ inventory_dir }}/../templates/private.toml.j2"
        health_url: http://127.0.0.1:8092/health
        rest_port: 8092