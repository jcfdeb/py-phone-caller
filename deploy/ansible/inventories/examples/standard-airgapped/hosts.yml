---
all:
  children:
    stack:
      hosts:
        isolated-example:
          ansible_host: 192.0.2.31
          ansible_user: deploy
      vars:
        stack_deploy_py_phone_caller: true
        stack_deploy_asterisk: false
        stack_deploy_openalert: false
        py_phone_caller_topology: standard
        py_phone_caller_ingress: caddy
        py_phone_caller_tls_mode: internal
        py_phone_caller_connectivity: airgapped
        py_phone_caller_public_url: https://caller.internal
        caddy_domain_name: caller.internal
        py_phone_caller_git_repo: ""
        py_phone_caller_local_src_path: /srv/releases/py-phone-caller
        py_phone_caller_airgap_networks: []
        py_phone_caller_airgap_bundle_dir: /srv/offline/py-phone-caller
        py_phone_caller_airgap_manifest_path: /srv/offline/bundle-manifest.json
        py_phone_caller_airgap_manifest_checksum: ""
        py_phone_caller_airgap_source_manifest_path: /srv/releases/source-manifest.json
        py_phone_caller_airgap_source_manifest_checksum: ""
        py_phone_caller_airgap_rust_toolchain: ""
        # Intentionally incomplete: supply the trusted offline artifact manifest,
        # staged runtimes/caches/models and Vault secrets from docs/topologies.md.
        # System APT sources must use signed file: mirrors; no public fallback.
        py_phone_caller_config:
          auth:
            provider: local
            oauth2:
              enabled: false
          gateway:
            behind_gateway: false
          py_phone_caller_ui:
            ui_listen_on_host: 127.0.0.1
          caller_prometheus_webhook:
            prometheus_webhook_receivers: []
          caller_sms:
            caller_sms_carrier: on_premise
            modems: []
          generate_audio:
            tts_engine: piper_tts
            pre_trained_models_folder: /srv/offline/py-phone-caller/models
            preload_models: []
