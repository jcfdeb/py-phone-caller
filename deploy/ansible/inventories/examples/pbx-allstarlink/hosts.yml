---
stack:
  hosts:
    pbx-example:
      ansible_host: 192.0.2.30
      ansible_user: deploy
  vars:
    stack_deploy_py_phone_caller: false
    stack_deploy_asterisk: true
    stack_deploy_openalert: false
    asterisk_package_provider: allstarlink
    asterisk_allstarlink_version: "2:22.10.1+asl3-3.10.8-1.deb13"
    asterisk_http_bindaddr: 127.0.0.1
    asterisk_sip_bindaddr: "127.0.0.1:5060"
    asterisk_sip_trunk_enabled: false
    local_sip: false
    local_iax: false
    ari_username: py-phone-caller
    ari_password: "{{ vault_ari_password }}"
