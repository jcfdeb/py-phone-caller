---
all:
  children:
    stack:
      hosts:
        enterprise-example:
          ansible_host: 192.0.2.30
          ansible_user: deploy
      vars:
        stack_deploy_py_phone_caller: true
        stack_deploy_asterisk: false
        stack_deploy_openalert: false
        py_phone_caller_topology: enterprise
        # An existing Apache (or other reviewed edge) owns TLS and :443.
        # To manage Caddy instead: ingress=caddy, tls_mode=acme/internal/provided.
        py_phone_caller_ingress: external
        py_phone_caller_tls_mode: external
        py_phone_caller_connectivity: online
        py_phone_caller_public_url: https://caller.example.invalid
        py_phone_caller_local_src_path: /srv/releases/py-phone-caller
        gateway_keycloak_postgresql_url: jdbc:postgresql://127.0.0.1:5432/keycloak
        gateway_keycloak_postgresql_username: keycloak
        gateway_keycloak_postgresql_password: "{{ vault_keycloak_postgresql_password }}"
        # Intentionally incomplete: supply reviewed digest-pinned gateway
        # images, toolchain checksums and Vault-backed application/DB secrets.
        # Do not copy a live site's group_vars. See docs/topologies.md.
        py_phone_caller_config:
          py_phone_caller_ui:
            ui_listen_on_host: 127.0.0.1
          caller_prometheus_webhook:
            prometheus_webhook_receivers: []
          caller_sms:
            caller_sms_carrier: on_premise
            modems: []
