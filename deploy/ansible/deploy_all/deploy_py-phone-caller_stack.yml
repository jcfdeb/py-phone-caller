---
# Compatibility wrapper: retain app_servers and legacy inventory selection.
- name: Deploy the combined stack through the shared entry point
  ansible.builtin.import_playbook: ../site.yml
  vars:
    stack_hosts: app_servers
    stack_legacy_platform: true
    stack_deploy_py_phone_caller: true
    stack_deploy_asterisk: true
    stack_deploy_openalert: false
