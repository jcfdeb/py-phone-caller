apiVersion: v1
kind: Service
metadata:
  namespace: py-phone-caller
  name: generate-audio-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      name: http-8082
      targetPort: 8082
      protocol: TCP
  selector:
    app: generate-audio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: py-phone-caller
  name: audio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: py-phone-caller
  name: generate-audio-deployment
  labels:
    app: generate-audio
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      app: generate-audio
  template:
    metadata:
      labels:
        app: generate-audio
    spec:
      containers:
        - name: generate-audio
          image: quay.io/py-phone-caller/generate_audio:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: TZ
              value: "Europe/Rome"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: caller-config
              mountPath: /app/src/config/settings.toml
              subPath: settings.toml
            - name: audio-storage
              mountPath: /app/audio
      volumes:
        - name: caller-config
          configMap:
            name: py-phone-caller-config
        - name: audio-storage
          persistentVolumeClaim:
            claimName: audio-pvc
