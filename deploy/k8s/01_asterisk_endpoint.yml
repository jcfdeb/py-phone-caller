apiVersion: v1
kind: Service
metadata:
  namespace: py-phone-caller
  name: asterisk-service
spec:
  ports:
    - name: ari-http
      protocol: TCP
      port: 8088
      targetPort: 8088
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  namespace: py-phone-caller
  name: asterisk-service-ext
  labels:
    kubernetes.io/service-name: asterisk-service
addressType: IPv4
ports:
  - name: ari-http
    protocol: TCP
    port: 8088
endpoints:
  - addresses:
      - "192.168.1.200"
    conditions:
      ready: true
