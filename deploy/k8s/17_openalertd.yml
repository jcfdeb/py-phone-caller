apiVersion: v1
kind: Service
metadata:
  namespace: py-phone-caller
  name: openalertd-service
  labels:
    app: openalertd
spec:
  type: ClusterIP
  ports:
    - port: 8090
      name: http-rest
      targetPort: 8090
      protocol: TCP
    - port: 8088
      name: nostr-relay
      targetPort: 8088
      protocol: TCP
    - port: 19876
      name: udp-peering
      targetPort: 19876
      protocol: UDP
  selector:
    app: openalertd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: py-phone-caller
  name: openalertd-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: py-phone-caller
  name: openalertd-deployment
  labels:
    app: openalertd
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: openalertd
  template:
    metadata:
      labels:
        app: openalertd
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: openalertd
          image: quay.io/py-phone-caller/openalertd:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http-rest
            - containerPort: 8088
              name: nostr-relay
            - containerPort: 19876
              name: udp-peering
              protocol: UDP
          env:
            - name: OPENALERT_DAEMON__NAME
              value: "openalertd-k8s-hub"
            - name: OPENALERT_DAEMON__LOG_LEVEL
              value: "info"
            - name: OPENALERT_REST__LISTEN_HOST
              value: "0.0.0.0"
            - name: OPENALERT_REST__LISTEN_PORT
              value: "8090"
            - name: OPENALERT_STORAGE__ENABLED
              value: "true"
            - name: OPENALERT_STORAGE__PATH
              value: "/var/lib/openalertd/data/openalert.db"
            - name: OPENALERT_TEMPLATES__TEMPLATE_DIR
              value: "/templates"
            - name: OPENALERT_NOSTR__RELAY_SERVER__ENABLED
              value: "true"
            - name: OPENALERT_NOSTR__RELAY_SERVER__BIND_ADDRESS
              value: "0.0.0.0:8088"
            - name: OPENALERT_SOS__ENABLED
              value: "true"
            - name: OPENALERT_SMS__ENABLED
              value: "false"
            - name: OPENALERT_BITCHAT__ENABLED
              value: "false"
            - name: OPENALERT_PY_PHONE_CALLER__WEBHOOK_URL
              value: "http://caller-prometheus-webhook-service:8084/sms_before_call"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: openalertd-data
              mountPath: /var/lib/openalertd
      volumes:
        - name: openalertd-data
          persistentVolumeClaim:
            claimName: openalertd-data-pvc
