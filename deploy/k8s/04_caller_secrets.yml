apiVersion: v1
kind: Secret
metadata:
  namespace: py-phone-caller
  name: py-phone-caller-secrets
  labels:
    app: py-phone-caller
type: Opaque
stringData:
  DYNACONF_COMMONS__ASTERISK_PASS: "CHANGE_ME_ASTERISK_ARI_PASSWORD"
  DYNACONF_DATABASE__DB_PASSWORD: "use-a-secure-password"
  POSTGRES_PASSWORD: "use-a-secure-password"
  DYNACONF_CALLER_SMS__TWILIO_ACCOUNT_SID: ""
  DYNACONF_CALLER_SMS__TWILIO_AUTH_TOKEN: ""
  DYNACONF_PY_PHONE_CALLER_UI__UI_SECRET_KEY: "CHANGE_ME_UI_SECRET_KEY_FOR_SESSIONS"
  DYNACONF_PY_PHONE_CALLER_UI__UI_ADMIN_PASSWORD: "CHANGE_ME_UI_ADMIN_PASSWORD_12345"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_KEYCLOAK_ADMIN_PASSWORD"
  .secrets.toml: |-
    [commons]
    asterisk_pass = "CHANGE_ME_ASTERISK_ARI_PASSWORD"

    [database]
    db_password = "use-a-secure-password"

    [caller_sms]
    twilio_account_sid = ""
    twilio_auth_token = ""

    [py_phone_caller_ui]
    ui_secret_key = "CHANGE_ME_UI_SECRET_KEY_FOR_SESSIONS"
    ui_admin_password = "CHANGE_ME_UI_ADMIN_PASSWORD_12345"
