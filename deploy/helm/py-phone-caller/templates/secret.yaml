{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: py-phone-caller-secrets
  labels:
    app.kubernetes.io/name: {{ include "py-phone-caller.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DYNACONF_COMMONS__ASTERISK_PASS: {{ .Values.secrets.asteriskPass | quote }}
  DYNACONF_DATABASE__DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DYNACONF_CALLER_SMS__TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  DYNACONF_CALLER_SMS__TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  DYNACONF_PY_PHONE_CALLER_UI__UI_SECRET_KEY: {{ .Values.secrets.uiSecretKey | quote }}
  DYNACONF_PY_PHONE_CALLER_UI__UI_ADMIN_PASSWORD: {{ .Values.secrets.uiAdminPassword | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  .secrets.toml: |-
    [commons]
    asterisk_pass = {{ .Values.secrets.asteriskPass | quote }}

    [database]
    db_password = {{ .Values.secrets.dbPassword | quote }}

    [caller_sms]
    twilio_account_sid = {{ .Values.secrets.twilioAccountSid | quote }}
    twilio_auth_token = {{ .Values.secrets.twilioAuthToken | quote }}

    [py_phone_caller_ui]
    ui_secret_key = {{ .Values.secrets.uiSecretKey | quote }}
    ui_admin_password = {{ .Values.secrets.uiAdminPassword | quote }}
{{- end }}
