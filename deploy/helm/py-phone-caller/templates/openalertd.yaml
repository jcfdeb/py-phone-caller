{{- if .Values.openalertd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: openalertd-service
  labels:
    app: openalertd
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.openalertd.httpPort }}
      name: http-rest
      targetPort: {{ .Values.openalertd.httpPort }}
      protocol: TCP
    - port: {{ .Values.openalertd.relayPort }}
      name: nostr-relay
      targetPort: {{ .Values.openalertd.relayPort }}
      protocol: TCP
    - port: {{ .Values.openalertd.peeringPort }}
      name: udp-peering
      targetPort: {{ .Values.openalertd.peeringPort }}
      protocol: UDP
  selector:
    app: openalertd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openalertd-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.openalertd.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openalertd-deployment
  labels:
    app: openalertd
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: openalertd
  template:
    metadata:
      labels:
        app: openalertd
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: openalertd
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.openalertd.imageName }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.openalertd.httpPort }}
              name: http-rest
            - containerPort: {{ .Values.openalertd.relayPort }}
              name: nostr-relay
            - containerPort: {{ .Values.openalertd.peeringPort }}
              name: udp-peering
              protocol: UDP
          env:
            - name: OPENALERT_DAEMON__NAME
              value: {{ .Values.openalertd.nodeName | quote }}
            - name: OPENALERT_REST__LISTEN_HOST
              value: "0.0.0.0"
            - name: OPENALERT_REST__LISTEN_PORT
              value: {{ .Values.openalertd.httpPort | quote }}
            - name: OPENALERT_STORAGE__ENABLED
              value: "true"
            - name: OPENALERT_STORAGE__PATH
              value: "/var/lib/openalertd/data/openalert.db"
            - name: OPENALERT_TEMPLATES__TEMPLATE_DIR
              value: "/templates"
            - name: OPENALERT_NOSTR__RELAY_SERVER__ENABLED
              value: "true"
            - name: OPENALERT_NOSTR__RELAY_SERVER__BIND_ADDRESS
              value: "0.0.0.0:{{ .Values.openalertd.relayPort }}"
            - name: OPENALERT_SOS__ENABLED
              value: "true"
            - name: OPENALERT_SMS__ENABLED
              value: "false"
            - name: OPENALERT_BITCHAT__ENABLED
              value: "false"
            - name: OPENALERT_PY_PHONE_CALLER__WEBHOOK_URL
              value: "http://caller-prometheus-webhook-service:{{ .Values.services.callerPrometheusWebhook.port }}/sms_before_call"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.openalertd.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.openalertd.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: openalertd-data
              mountPath: /var/lib/openalertd
      volumes:
        - name: openalertd-data
          persistentVolumeClaim:
            claimName: openalertd-data-pvc
{{- end }}
