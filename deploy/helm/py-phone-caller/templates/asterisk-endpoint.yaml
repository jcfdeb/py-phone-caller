apiVersion: v1
kind: Service
metadata:
  name: asterisk-service
spec:
  ports:
    - name: ari-http
      protocol: TCP
      port: {{ .Values.asterisk.webPort }}
      targetPort: {{ .Values.asterisk.webPort }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: asterisk-service-ext
  labels:
    kubernetes.io/service-name: asterisk-service
addressType: IPv4
ports:
  - name: ari-http
    protocol: TCP
    port: {{ .Values.asterisk.webPort }}
endpoints:
  - addresses:
      - {{ .Values.asterisk.externalIp | quote }}
    conditions:
      ready: true
