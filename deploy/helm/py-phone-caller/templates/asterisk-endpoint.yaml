apiVersion: v1
kind: Service
metadata:
  name: asterisk-service
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.asterisk.webPort }}
      targetPort: {{ .Values.asterisk.webPort }}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: asterisk-service
subsets:
  - addresses:
      - ip: {{ .Values.asterisk.externalIp | quote }}
    ports:
      - port: {{ .Values.asterisk.webPort }}
