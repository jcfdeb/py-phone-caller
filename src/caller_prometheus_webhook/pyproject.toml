[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caller-prometheus-webhook"
version = "1.1.0"
description = "Caller Prometheus Webhook service for py-phone-caller"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "py-phone-caller contributors" }]
requires-python = ">=3.14, <3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "py_phone_caller_utils",
    "aiohttp>=3.9.0",
]

[project.scripts]
ppc-caller-prometheus-webhook = "caller_prometheus_webhook.caller_prometheus_webhook:main"

[tool.setuptools]
packages = ["caller_prometheus_webhook"]

[tool.setuptools.package-dir]
caller_prometheus_webhook = "."

[tool.setuptools.package-data]
caller_prometheus_webhook = ["*.py", "README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["Dockerfile*", "pyproject.toml"]

