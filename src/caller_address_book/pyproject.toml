[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caller-address-book"
version = "1.1.0"
description = "Caller Address Book service for py-phone-caller"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "py-phone-caller contributors" }]
requires-python = ">=3.14, <3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "py_phone_caller_utils",
    "aiohttp>=3.9.0",
    "pydantic>=2.13.4",
]

[project.scripts]
ppc-caller-address-book = "caller_address_book.caller_address_book:main"

[tool.setuptools]
packages = ["caller_address_book"]

[tool.setuptools.package-dir]
caller_address_book = "."

[tool.setuptools.package-data]
caller_address_book = ["*.py", "README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["Dockerfile*", "pyproject.toml"]

