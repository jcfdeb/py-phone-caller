[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caller-address-book"
version = "1.0.0"
description = "Caller Address Book service for py-phone-caller"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "py_phone_caller_utils",
    "aiohttp>=3.9.0",
]

[tool.setuptools.package-dir]
caller_address_book = "."

[tool.setuptools.package-data]
caller_address_book = ["*"]
