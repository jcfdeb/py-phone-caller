[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-phone-caller-ui"
version = "1.0.0"
description = "Web Dashboard for py-phone-caller"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "py_phone_caller_utils",
    "flask>=3.0.0",
    "flask[async]>=3.0.0",
    "asgiref>=3.8.0",
    "flask-login>=0.6.3",
    "flask-session>=0.8.0",
    "requests>=2.31.0",
    "hypercorn>=0.16.0",
    "gunicorn>=21.2.0",
]

[tool.setuptools.package-dir]
py_phone_caller_ui = "."

[tool.setuptools.package-data]
py_phone_caller_ui = ["templates/**/*", "static/**/*", "*.html", "*.css", "*.js"]
