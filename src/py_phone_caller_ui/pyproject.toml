[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-phone-caller-ui"
version = "1.1.0"
description = "Web Dashboard for py-phone-caller"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "py-phone-caller contributors" }]
requires-python = ">=3.14, <3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "py_phone_caller_utils",
    "flask>=3.0.0",
    "flask[async]>=3.0.0",
    "asgiref>=3.8.0",
    "flask-login>=0.6.3",
    "flask-session>=0.8.0",
    "requests>=2.31.0",
    "hypercorn>=0.16.0",
    "gunicorn>=21.2.0",
    "flask-babel>=4.0.0",
]

[project.scripts]
ppc-ui = "py_phone_caller_ui.app:main"

[tool.setuptools]
packages = [
    "py_phone_caller_ui",
    "py_phone_caller_ui.address_book",
    "py_phone_caller_ui.calls",
    "py_phone_caller_ui.home",
    "py_phone_caller_ui.login",
    "py_phone_caller_ui.schedule_call",
    "py_phone_caller_ui.sms",
    "py_phone_caller_ui.users",
    "py_phone_caller_ui.ws_events",
]

[tool.setuptools.package-dir]
py_phone_caller_ui = "."

[tool.setuptools.package-data]
py_phone_caller_ui = [
    "templates/**/*",
    "static/**/*",
    "translations/**/*",
    "*/templates/**/*",
    "*.html",
    "*.css",
    "*.js",
    "README.md",
]

[tool.setuptools.exclude-package-data]
"*" = ["Dockerfile*", "pyproject.toml"]

