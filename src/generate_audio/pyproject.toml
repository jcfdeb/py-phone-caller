[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-audio"
version = "1.0.0"
description = "TTS Audio Generation service for py-phone-caller"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "py-phone-caller contributors" }]
requires-python = ">=3.14, <3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "py_phone_caller_utils",
    "aiohttp>=3.9.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",
    "numpy>=2.0.0",
    "soundfile>=0.12.1",
    "scipy>=1.13.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "huggingface-hub>=0.24.0",
    "kokoro>=0.9.4",
    "boto3>=1.34.0",
    "gTTS>=2.5.4",
    "num2words>=0.5.13,<0.5.15",
    "piper-tts>=1.2.0",
]

[project.scripts]
ppc-generate-audio = "generate_audio.generate_audio:main"

[tool.setuptools]
packages = ["generate_audio"]

[tool.setuptools.package-dir]
generate_audio = "."

[tool.setuptools.package-data]
generate_audio = ["*.py", "README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["Dockerfile*", "pyproject.toml", "pre_trained_models*", "pre_trained_models/**/*", "audio*", "audio/**/*"]

