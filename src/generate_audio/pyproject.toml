[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-audio"
version = "1.0.0"
description = "TTS Audio Generation service for py-phone-caller"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "py_phone_caller_utils",
    "aiohttp>=3.9.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",
    "numpy>=2.0.0",
    "soundfile>=0.12.1",
    "scipy>=1.13.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "huggingface-hub>=0.24.0",
    "kokoro>=0.9.4",
    "boto3>=1.34.0",
    "gTTS>=2.5.4",
    "num2words>=0.5.13,<0.5.15",
    "piper-tts>=1.2.0",
]

[tool.setuptools.package-dir]
generate_audio = "."

[tool.setuptools.package-data]
generate_audio = ["*"]
