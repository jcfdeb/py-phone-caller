# ==============================================================================
# cargo-deny Supply-Chain, Advisory, License & Registry Policy for openalertd
# ==============================================================================

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Expires 2027-06-01: libsqlite3-sys via rusqlite 0.32 requires crafted untrusted SQLite+WAL files; openalertd only opens daemon-owned local spool DBs. Planned major upgrade to rusqlite >=0.41." },
    { id = "RUSTSEC-2026-0543", reason = "Expires 2027-06-01: chrono unmaintained notice with no upstream patch; also transitively required by tera 1.20." },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
