#  user: 'admin@py-phone-caller.link'
#  password: 'use-a-secure-password'

x-common-env: &common-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-false}
  DYNACONF_COMMONS__ASTERISK_HOST: ${ASTERISK_HOST:-host.containers.internal}
  DYNACONF_QUEUE__QUEUE_HOST: redis
  DYNACONF_QUEUE__QUEUE_URL: redis://redis:6379/7
  DYNACONF_CALL_REGISTER__CALL_REGISTER_HOST: caller_register
  DYNACONF_CALL_REGISTER__CALL_REGISTER_PORT: 8083
  DYNACONF_GENERATE_AUDIO__GENERATE_AUDIO_HOST: generate_audio
  DYNACONF_GENERATE_AUDIO__GENERATE_AUDIO_PORT: 8082
  DYNACONF_CALLER_ADDRESS_BOOK__CALLER_ADDRESS_BOOK_HOST: caller_address_book
  DYNACONF_CALLER_ADDRESS_BOOK__CALLER_ADDRESS_BOOK_PORT: 8087
  DYNACONF_ASTERISK_CALL__ASTERISK_CALL_HOST: asterisk_caller
  DYNACONF_ASTERISK_CALL__ASTERISK_CALL_PORT: 8081
  DYNACONF_CALLER_SMS__CALLER_SMS_HOST: caller_sms
  DYNACONF_CALLER_SMS__CALLER_SMS_PORT: 8085
  DYNACONF_SCHEDULED_CALLS__SCHEDULED_CALLS_HOST: caller_scheduler
  DYNACONF_SCHEDULED_CALLS__SCHEDULED_CALLS_PORT: 8086

x-app-env-files: &app-env-files
  - path: ./env/py-phone-caller.env
    required: false
  - path: ./env/py-phone-caller.secrets.env
    required: false

x-db-common-env: &db-common-env
  <<: *common-env
  DYNACONF_DATABASE__DB_HOST: db
  DYNACONF_DATABASE__DB_USER: py_phone_caller
  DYNACONF_DATABASE__DB_PASSWORD: ${POSTGRES_PASSWORD:-py_phone_caller_password}
  DYNACONF_DATABASE__DB_NAME: py_phone_caller
  PICCOLO_CONF: py_phone_caller_utils.py_phone_caller_db.piccolo_conf

services:
  # --- Infrastructure ---
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: py-phone-caller-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=py_phone_caller
      - POSTGRES_USER=py_phone_caller
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-py_phone_caller_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U py_phone_caller"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: py-phone-caller-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from ${CADDY_DOMAIN_NAME:-py-phone-caller.lan} --to py-phone-caller-ui:5000
    depends_on:
      - py_phone_caller_ui

  # --- Microservices ---
  caller_register:
    build:
      context: ../..
      dockerfile: src/caller_register/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/caller_register:${VERSION:-latest}
    container_name: caller-register
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: caller-register
    restart: always

  generate_audio:
    build:
      context: ../..
      dockerfile: src/generate_audio/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/generate_audio:${VERSION:-latest}
    container_name: generate-audio
    env_file: *app-env-files
    ports:
      - "8082:8082"
    volumes:
      - audio_data:/app/audio
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: generate-audio
    restart: always

  caller_address_book:
    build:
      context: ../..
      dockerfile: src/caller_address_book/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/caller_address_book:${VERSION:-latest}
    container_name: caller-address-book
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8087:8087"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: caller-address-book
    restart: always

  asterisk_caller:
    build:
      context: ../..
      dockerfile: src/asterisk_caller/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/asterisk_caller:${VERSION:-latest}
    container_name: asterisk-caller
    env_file: *app-env-files
    depends_on:
      caller_register:
        condition: service_healthy
      generate_audio:
        condition: service_healthy
      caller_address_book:
        condition: service_healthy
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: asterisk-caller
      DYNACONF_CALL_REGISTER__CALL_REGISTER_HOST: caller_register
      DYNACONF_GENERATE_AUDIO__GENERATE_AUDIO_HOST: generate_audio
      DYNACONF_CALLER_ADDRESS_BOOK__CALLER_ADDRESS_BOOK_HOST: caller_address_book
    restart: always

  asterisk_ws_monitor:
    build:
      context: ../..
      dockerfile: src/asterisk_ws_monitor/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/asterisk_ws_monitor:${VERSION:-latest}
    container_name: asterisk-ws-monitor
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
      asterisk_caller:
        condition: service_healthy
      generate_audio:
        condition: service_healthy
      caller_register:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: asterisk-ws-monitor
      DYNACONF_ASTERISK_CALL__ASTERISK_CALL_HOST: asterisk_caller
      DYNACONF_GENERATE_AUDIO__GENERATE_AUDIO_HOST: generate_audio
      DYNACONF_CALL_REGISTER__CALL_REGISTER_HOST: caller_register
    restart: always

  asterisk_recaller:
    build:
      context: ../..
      dockerfile: src/asterisk_recaller/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/asterisk_recaller:${VERSION:-latest}
    container_name: asterisk-recaller
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
      asterisk_caller:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: asterisk-recaller
      DYNACONF_ASTERISK_CALL__ASTERISK_CALL_HOST: asterisk_caller
    restart: always

  caller_sms:
    build:
      context: ../..
      dockerfile: src/caller_sms/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/caller_sms:${VERSION:-latest}
    container_name: caller-sms
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: caller-sms
    # devices:
    #   - "/dev/ttyUSB2:/dev/ttyUSB2"
    restart: always

  caller_prometheus_webhook:
    build:
      context: ../..
      dockerfile: src/caller_prometheus_webhook/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/caller_prometheus_webhook:${VERSION:-latest}
    container_name: caller-prometheus-webhook
    env_file: *app-env-files
    depends_on:
      asterisk_caller:
        condition: service_healthy
      caller_sms:
        condition: service_healthy
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: caller-prometheus-webhook
      DYNACONF_ASTERISK_CALL__ASTERISK_CALL_HOST: asterisk_caller
      DYNACONF_CALLER_SMS__CALLER_SMS_HOST: caller_sms
    restart: always

  caller_scheduler:
    build:
      context: ../..
      dockerfile: src/caller_scheduler/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/caller_scheduler:${VERSION:-latest}
    container_name: caller-scheduler
    env_file: *app-env-files
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8086:8086"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: caller-scheduler
      DYNACONF_QUEUE__QUEUE_HOST: redis
      DYNACONF_QUEUE__QUEUE_URL: redis://redis:6379
    restart: always

  py_phone_caller_ui:
    build:
      context: ../..
      dockerfile: src/py_phone_caller_ui/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/py_phone_caller_ui:${VERSION:-latest}
    container_name: py-phone-caller-ui
    env_file: *app-env-files
    depends_on:
      db:
        condition: service_healthy
      caller_scheduler:
        condition: service_healthy
      caller_register:
        condition: service_healthy
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: py-phone-caller-ui
      DYNACONF_SCHEDULED_CALLS__SCHEDULED_CALLS_HOST: caller_scheduler
      DYNACONF_CALL_REGISTER__CALL_REGISTER_HOST: caller_register
      DYNACONF_CALLER_ADDRESS_BOOK__CALLER_ADDRESS_BOOK_HOST: caller_address_book
      UI_USER_RESET_PASSWORD: ${UI_USER_RESET_PASSWORD:-false}
    restart: always

  celery_worker:
    build:
      context: ../..
      dockerfile: src/celery_worker/Dockerfile
    image: ${MY_DOCKER_REGISTRY:-localhost}/celery_worker:${VERSION:-latest}
    container_name: celery-worker
    env_file: *app-env-files
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      caller_register:
        condition: service_healthy
      asterisk_caller:
        condition: service_healthy
      caller_scheduler:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      <<: *db-common-env
      OTEL_SERVICE_NAME: celery-worker
      DYNACONF_QUEUE__QUEUE_HOST: redis
      DYNACONF_QUEUE__QUEUE_URL: redis://redis:6379
      DYNACONF_CALL_REGISTER__CALL_REGISTER_HOST: caller_register
      DYNACONF_ASTERISK_CALL__ASTERISK_CALL_HOST: asterisk_caller
      DYNACONF_SCHEDULED_CALLS__SCHEDULED_CALLS_HOST: caller_scheduler
    restart: always

volumes:
  pgdata:
  audio_data:
  caddy_data:
  caddy_config:
    