---
- name: Deploy Asterisk PBX
  hosts: all
  become: yes
  vars:
    # Define these with Ansible Vault, inventory/group_vars, or --extra-vars.
    ari_password: "{{ vault_ari_password }}"
    sip_username: "{{ vault_sip_username }}"
    sip_password: "{{ vault_sip_password }}"
  roles:
    - asterisk_py_phone_caller

- name: Deploy Py-Phone-Caller Stack
  hosts: all
  become: yes
  vars:
    # Path to local repository root relative to this playbook
    py_phone_caller_local_src_path: "{{ playbook_dir }}/../../.."

    # PostgreSQL administrative credentials for unattended provisioning
    py_phone_caller_db_admin_user: "{{ vault_db_admin_user | default('postgres') }}"
    py_phone_caller_db_admin_password: "{{ vault_db_admin_password | default('') }}"

    # Configuration overrides
    py_phone_caller_config:
      commons:
        asterisk_host: "127.0.0.1"
        asterisk_user: "py-phone-caller"
        asterisk_pass: "{{ vault_ari_password }}"
      database:
        db_host: "127.0.0.1"
        db_password: "{{ vault_db_password }}"
      queue:
        queue_host: "127.0.0.1"
        queue_url: "redis://127.0.0.1:6379/7"
  roles:
    - deploy_py-phone-caller
