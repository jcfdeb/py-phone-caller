---
asterisk_service: asterisk
asterisk_user: asterisk
asterisk_group: asterisk
asterisk_conf_dir: /etc/asterisk
# RHEL 64-bit uses /usr/lib64
asterisk_module_dir: /usr/lib64/asterisk/modules
asterisk_data_dir: /var/lib/asterisk
asterisk_cache_dir: /var/cache/asterisk
asterisk_sounds_dir: /usr/share/asterisk/sounds/en

# Asterisk packages for EL8/9/10.
# On EL10+ (Rocky/RHEL/AlmaLinux 10), packages are provided via the lucamagrone/epel-10-extra COPR repository.
asterisk_packages:
  - asterisk
  - asterisk-devel
  - asterisk-pjsip        # CRITICAL: Often separate in RPMs
  - asterisk-voicemail-plain
  - asterisk-curl         # Required for Function CURL
  - curl

system_dependencies:
  - "@Development Tools"
  - git
  - libuuid-devel
  - libxml2-devel
  - policycoreutils-python-utils # Required for SELinux management
  - python3-libselinux           # Required for Ansible SELinux modules