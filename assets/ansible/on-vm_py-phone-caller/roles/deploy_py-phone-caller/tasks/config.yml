---
# Dynaconf reads settings.toml and then .secrets.toml from CALLER_CONFIG_DIR,
# merging the second over the first (see py_phone_caller_utils/config.py). The
# split exists so the credentials file can be 0600 while the rest of the
# configuration stays readable for troubleshooting.
#
# Both files are validated with tomllib before they are moved into place, so a
# templating mistake fails the play instead of every systemd unit.

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ py_phone_caller_config_dir }}"
    state: directory
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0750"

- name: Render settings.toml
  ansible.builtin.template:
    src: settings.toml.j2
    dest: "{{ py_phone_caller_settings_file }}"
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0640"
    validate: "{{ _ppc_toml_validate }}"
  vars:
    _ppc_render_secrets: false
  notify: Restart py-phone-caller services

- name: Render .secrets.toml
  ansible.builtin.template:
    src: settings.toml.j2
    dest: "{{ py_phone_caller_secrets_file }}"
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: "0600"
    validate: "{{ _ppc_toml_validate }}"
  vars:
    _ppc_render_secrets: true
  notify: Restart py-phone-caller services

- name: Remove the runtime files written by earlier releases
  ansible.builtin.file:
    path: "{{ py_phone_caller_config_dir }}/{{ item }}"
    state: absent
  loop:
    - "py-phone-caller.env"
    - "settings.source.toml"
