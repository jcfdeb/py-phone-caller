---
# The microservices listen on loopback and are reached through Caddy, so only
# the proxy ports are opened. Add py_phone_caller_firewall_extra_ports to
# expose a service directly (for example 8084 for a remote Alertmanager).

- name: Ensure firewalld is installed and running (RHEL/Rocky)
  when: ansible_facts['os_family'] == "RedHat"
  block:
    - name: Install firewalld
      ansible.builtin.package:
        name:
          - firewalld
          - python3-firewall
        state: present

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Keep SSH reachable
      ansible.posix.firewalld:
        service: ssh
        permanent: true
        immediate: true
        state: enabled

    - name: Open the application ports
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ py_phone_caller_firewall_ports + py_phone_caller_firewall_extra_ports }}"

- name: Configure UFW (Debian/Ubuntu)
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    # Done before enabling the firewall: the play is running over this port.
    - name: Keep SSH reachable
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Open the application ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ py_phone_caller_firewall_ports + py_phone_caller_firewall_extra_ports }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
