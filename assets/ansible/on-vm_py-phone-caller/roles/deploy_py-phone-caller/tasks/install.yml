---
- name: Ensure uv installation directory exists
  file:
    path: "{{ py_phone_caller_uv_bin | dirname }}"
    state: directory
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: '0755'
  become: yes

- name: Install uv
  shell: "curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR={{ py_phone_caller_uv_bin | dirname }} sh"
  args:
    creates: "{{ py_phone_caller_uv_bin }}"
  become: yes
  become_user: "{{ py_phone_caller_user }}"

- name: Check if virtual environment already exists
  stat:
    path: "{{ py_phone_caller_venv_dir }}/bin/python"
  register: venv_python_stat

- name: Sync uv workspace with production dependencies (offline first)
  command: "{{ py_phone_caller_uv_bin }} sync --frozen --all-packages --no-dev --python 3.14 --offline"
  args:
    chdir: "{{ py_phone_caller_install_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ py_phone_caller_venv_dir }}"
    UV_PYTHON_INSTALL_DIR: "{{ py_phone_caller_uv_python_install_dir }}"
  become: yes
  become_user: "{{ py_phone_caller_user }}"
  failed_when: false
  register: uv_sync_offline
  when: not venv_python_stat.stat.exists

- name: Sync uv workspace with production dependencies (online fallback)
  command: "{{ py_phone_caller_uv_bin }} sync --frozen --all-packages --no-dev --python 3.14"
  args:
    chdir: "{{ py_phone_caller_install_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ py_phone_caller_venv_dir }}"
    UV_PYTHON_INSTALL_DIR: "{{ py_phone_caller_uv_python_install_dir }}"
    UV_EXTRA_INDEX_URL: "http://artifacts.py-phone-caller.lan:8080/simple"
    UV_INSECURE_HOST: "artifacts.py-phone-caller.lan"
  become: yes
  become_user: "{{ py_phone_caller_user }}"
  when: not venv_python_stat.stat.exists and uv_sync_offline.rc != 0
  ignore_errors: yes

- name: Build Rust SMS engine for on-premise deployments
  command: "{{ py_phone_caller_uv_bin }} run --with maturin maturin develop --manifest-path app/py-phone-caller-utils/py_phone_caller_utils/sms/rust_engine/Cargo.toml"
  args:
    chdir: "{{ py_phone_caller_install_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ py_phone_caller_venv_dir }}"
    UV_PYTHON_INSTALL_DIR: "{{ py_phone_caller_uv_python_install_dir }}"
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  become: yes
  become_user: "{{ py_phone_caller_user }}"
  when: py_phone_caller_final_config.caller_sms.caller_sms_carrier | default('') == 'on_premise'

- name: Ensure venv ownership
  command: chown -R {{ py_phone_caller_user }}:{{ py_phone_caller_group }} {{ py_phone_caller_venv_dir }}
  become: yes
  changed_when: false

- name: Ensure log directory exists
  file:
    path: "{{ py_phone_caller_log_dir }}"
    state: directory
    owner: "{{ py_phone_caller_user }}"
    group: "{{ py_phone_caller_group }}"
    mode: '0755'
