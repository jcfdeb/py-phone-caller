[defaults]
inventory = inventory
roles_path = ./roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
host_key_checking = False
# yaml-formatted task results (ansible-core 2.13+; the old community.general
# "yaml" stdout callback was removed in that collection 12.0.0)
result_format = yaml
display_skipped_hosts = False
force_handlers = True
# The uv sync of the workspace (PyTorch and friends) takes a while.
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
