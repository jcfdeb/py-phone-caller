name: Release & Packaging Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify-packages:
    name: Build & Verify All Release Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install workspace dependencies
        run: uv sync --frozen

      - name: Install Rust toolchain for openalertd
        uses: dtolnay/rust-toolchain@stable

      - name: Run packaging test suites
        run: |
          uv run pytest \
            deploy/ansible/tests/test_ansible_bundle.py \
            tests/test_pypi_packaging.py \
            tests/test_linux_packaging.py \
            tests/test_k8s_and_compose_packaging.py \
            tests/test_docs_coherence.py -v

      - name: Build all release artifacts (Ansible, PyPI, RPM/DEB, K8s/Helm)
        run: uv run python deploy/packaging/build_all_releases.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: py-phone-caller-release-packages
          path: |
            dist/SHA256SUMS
            dist/RELEASE_MANIFEST.json
            dist/ansible/*
            dist/pypi/*
            dist/linux/*
            dist/k8s/*

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS
            dist/RELEASE_MANIFEST.json
            dist/ansible/*.tar.gz
            dist/ansible/*.sha256
            dist/pypi/*.whl
            dist/pypi/*.tar.gz
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/k8s/*.tgz
            dist/k8s/*.tar.gz
          generate_release_notes: true
