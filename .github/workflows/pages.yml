name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Hybrid Landing Pages & Documentation Portal
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv & Python 3.12 for MkDocs Material
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install MkDocs Material
        run: |
          uv python install 3.12
          uv venv .venv-docs --python 3.12
          uv pip install --python .venv-docs/bin/python "mkdocs>=1.6,<2.0" "mkdocs-material>=9.5,<10.0"
          echo "$PWD/.venv-docs/bin" >> "$GITHUB_PATH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build hybrid Pages site (_site/)
        run: python3 deploy/pages/build_pages.py --output-dir _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
