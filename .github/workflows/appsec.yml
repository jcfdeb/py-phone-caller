name: AppSec & Supply-Chain Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly Monday 06:00 UTC scan to detect newly published CVEs against unchanged lockfiles
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  appsec:
    name: SAST, SCA, Secrets & IaC Security Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (full history for Gitleaks)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install native Linux headers for openalertd (bluer, udev, openssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libudev-dev \
            libssl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14 (workspace) and Python 3.12 (Semgrep tool)
        run: |
          uv python install 3.14 3.12
          uv sync --frozen --all-packages

      - name: Install Rust stable toolchain with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install pinned AppSec CLI tools via mise
        uses: jdx/mise-action@v5

      - name: Verify AppSec toolchain (sec:doctor)
        run: task sec:doctor

      - name: Run Fast & Full SAST Suite (Ruff S, Bandit, Semgrep, Clippy)
        run: task sec:sast:full

      - name: Run Secrets History Audit (Gitleaks + TruffleHog)
        run: task sec:secrets:history

      - name: Run IaC Security Scan (Dockerfiles, Compose, K8s, Helm)
        run: task sec:iac

      - name: Generate CycloneDX Workspace SBOM
        run: task sec:sbom

      - name: Run Workspace Dependency & Supply-Chain Audits (pip-audit, cargo-audit, cargo-deny, OSV)
        run: task sec:sca:all

      - name: Upload SARIF reports to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: .security-reports

      - name: Upload Security Reports & CycloneDX SBOM Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appsec-reports-and-sbom
          include-hidden-files: true
          path: |
            .security-reports/*.sarif
            .security-reports/*.json
            .security-reports/*.cdx.json
