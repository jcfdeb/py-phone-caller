[project]
name = "py-phone-caller-workspace"
version = "1.0.0"
description = "Automated phone call and SMS alerting platform for Asterisk-based environments"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = []

[tool.uv.workspace]
members = [
    "src/py-phone-caller-utils",
    "src/asterisk_caller",
    "src/asterisk_recaller",
    "src/asterisk_ws_monitor",
    "src/caller_address_book",
    "src/caller_prometheus_webhook",
    "src/caller_register",
    "src/caller_scheduler",
    "src/caller_sms",
    "src/generate_audio",
    "src/py_phone_caller_ui",
    "src/celery_worker",
]

[tool.uv.sources]
py_phone_caller_utils = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.5",
    "pytest-env>=1.1.3",
    "aiohttp-basicauth-middleware>=1.2.0",
    "ruff>=0.9.0",
    "maturin>=1.14.1",
]
