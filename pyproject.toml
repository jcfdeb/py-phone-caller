[project]
name = "py-phone-caller-workspace"
version = "1.1.0"
description = "Automated phone call and SMS alerting platform for Asterisk-based environments"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = []

[tool.uv]
# curated-tokenizers 0.0.9 ships only an sdist, and its Cython sources crash
# the Cython 3.1 compiler on Python 3.14 ("TypeError: 'NoneType' object is
# unsliceable" while cythonising curated_tokenizers/_bbpe.pyx). It reaches us
# through generate-audio -> kokoro -> misaki[en] -> spacy-curated-transformers.
# Build dependencies are not part of the resolution, so this only pins the
# compiler used to build sdists; uv.lock is unaffected.
build-constraint-dependencies = ["cython==3.0.12"]

[tool.uv.workspace]
members = [
    "src/py-phone-caller-utils",
    "src/asterisk_caller",
    "src/asterisk_recaller",
    "src/asterisk_ws_monitor",
    "src/caller_address_book",
    "src/caller_prometheus_webhook",
    "src/caller_register",
    "src/caller_scheduler",
    "src/caller_sms",
    "src/generate_audio",
    "src/py_phone_caller_ui",
    "src/celery_worker",
]

[tool.uv.sources]
py_phone_caller_utils = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.5",
    "pytest-env>=1.1.3",
    "aiohttp-basicauth-middleware>=1.2.0",
    "ruff>=0.9.0",
    "maturin>=1.14.1",
]

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".task",
    ".security-reports",
    "test",
    "tests",
    "deploy/ansible/tests",
    "src/openalert/tests",
    "src/openalert/packaging/tests",
    "dist",
    "build",
    "docs",
]
# B110/B112: existing defensive fail-open telemetry/UI try-except-pass/continue blocks
# B404/B603/B607: controlled non-shell subprocess calls to piper/ffmpeg/cargo/packaging tools
# B104/B105: false positives on 0.0.0.0->127.0.0.1 sanitizer & env-var constant names
# B615: existing Hugging Face Hub TTS model downloaders (facebook_mms / kokoro_tts)
skips = ["B104", "B105", "B110", "B112", "B404", "B603", "B607", "B615"]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Test suites & test harnesses
"test/**/*.py" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603", "S607"]
"deploy/ansible/tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108", "S310", "S501", "S603", "S607"]
"deploy/ansible/tests/test_runtime_isolation.py" = ["S101", "S102", "S307"]
"deploy/ansible/tools/**/*.py" = ["S101"]
"src/openalert/tests/**/*.py" = ["S101", "S104", "S310", "S603", "S607"]
"src/openalert/packaging/tests/**/*.py" = ["S101", "S603", "S607"]
# Build & packaging orchestrators (DEB/RPM format requires MD5/SHA1 control digests)
"deploy/packaging/**/*.py" = ["S101", "S324", "S603", "S607"]
"deploy/pages/**/*.py" = ["S603", "S607"]
"deploy/ansible/packaging/**/*.py" = ["S603", "S607"]
"deploy/ansible/roles/openalert/files/*.py" = ["S103", "S104", "S603"]
"deploy/ansible/roles/stack_lifecycle/files/stack_snapshot.py" = ["S108", "S112"]
"src/openalert/packaging/release_bundle.py" = ["S603", "S607"]
# Local dev/bootstrap gateway scripts using self-signed TLS
"deploy/gateway/**/*.py" = ["S501"]
"deploy/ansible/roles/gateway/files/**/*.py" = ["S501"]
# Controlled non-shell audio synthesis subprocesses (piper/ffmpeg)
"src/generate_audio/runners.py" = ["S603"]
# Verified false positives: env-var constant names & 0.0.0.0 -> 127.0.0.1 host sanitizer
"src/py-phone-caller-utils/py_phone_caller_utils/py_phone_caller_db/db_user.py" = ["S105"]
"src/py_phone_caller_ui/services.py" = ["S105"]
"src/py_phone_caller_ui/home/__init__.py" = ["S104", "S110"]
# Existing defensive fail-open try-except blocks in UI/telemetry/TTS cleanup
"src/asterisk_caller/asterisk_caller.py" = ["S110"]
"src/asterisk_caller/constants.py" = ["S110"]
"src/caller_address_book/services.py" = ["S110"]
"src/caller_sms/services.py" = ["S110"]
"src/py-phone-caller-utils/py_phone_caller_utils/event_bus.py" = ["S110"]
"src/py-phone-caller-utils/py_phone_caller_utils/py_phone_caller_db/db_address_book.py" = ["S112"]
"src/py-phone-caller-utils/py_phone_caller_utils/py_phone_caller_voices/*.py" = ["S110"]
"src/py-phone-caller-utils/py_phone_caller_utils/web/__init__.py" = ["S110"]
"src/py_phone_caller_ui/address_book/__init__.py" = ["S110", "S112"]
"src/py_phone_caller_ui/home/health.py" = ["S110"]
"src/py_phone_caller_ui/schedule_call/__init__.py" = ["S110"]
"src/py_phone_caller_ui/ws_events/__init__.py" = ["S110"]

